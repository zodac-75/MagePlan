# Releases MagePlan to CurseForge.
#
# How it works: on every push to main, the workflow reads the version from the
# first line of CHANGELOG.md ("# MagePlan 1.6.1"). If that version has no tag
# yet, it creates the tag, packages the addon as MagePlan-<version>.zip and
# uploads it to CurseForge with the changelog. Pushes that don't change the
# version do nothing.
#
# A version with "beta" or "alpha" in it (e.g. "# MagePlan 1.7.0-beta1") is
# uploaded as a beta/alpha file on CurseForge, which only opted-in players get.
#
# Needs the repository secret CF_API_KEY (a CurseForge API token).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # create the version tag and a GitHub release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version and tag it if new
        id: version
        run: |
          VERSION=$(head -n 1 CHANGELOG.md | sed -n 's/^# MagePlan \([0-9][0-9.]*\(-[A-Za-z0-9.]*\)\{0,1\}\).*$/\1/p')
          if [ -z "$VERSION" ]; then
            echo "First line of CHANGELOG.md must look like: # MagePlan 1.6.1"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "Version $VERSION is already released, nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$VERSION" -m "MagePlan $VERSION"
            git push origin "$VERSION"
            echo "Releasing version $VERSION."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and upload to CurseForge
        if: steps.version.outputs.release == 'true'
        uses: BigWigsMods/packager@v2
        with:
          # -g: CurseForge game version for WoW Forever.
          # -n: zip name, e.g. MagePlan-1.6.1.zip
          args: -g 1.60.1 -n "{package-name}-{project-version}"
